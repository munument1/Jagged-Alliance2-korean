name: Publish v0.1.8-alpha (archived)

# v0.1.8-alpha is frozen after the verified publication run. Keep this file as
# a historical marker so later localization commits cannot move the tag or
# replace the published release assets automatically.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Frozen release
        run: echo "v0.1.8-alpha is archived; use the next release workflow for new builds."
