name: Publish v0.1.3-alpha

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.1.3-alpha.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.1.3-alpha
  cancel-in-progress: false

jobs:
  validate-package-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate runtime dialogue
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_runtime_dialogue.py
          python3 tools/verify_runtime_dialogue_zero.py

      - name: Validate release overlay
        shell: bash
        run: |
          set -euo pipefail
          test -d Patch/Data
          test -d Patch/Data-1.13
          test -f Patch/ja2.exe
          test -f Patch/Ja2.ini
          test -f install.ps1
          test -f README.md
          test -f RELEASE_NOTES_v0.1.3-alpha.md
          test ! -d Patch/Data-UB
          test "$(find Patch/Data/NPCData -maxdepth 1 -type f -iname 'civ*.edt' -printf '%f\n' | sort)" = "civ52.edt"
          for id in 004 013 014 015 020 031 037 040 149 167 169; do
            base="$(find Patch/Data/MercEdt -maxdepth 1 -type f -iname "${id}.edt" -print -quit)"
            test -n "${base}"
            cmp "${base}" "Patch/Data-1.13/MercEdt/${id}.EDT"
          done

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail
          name="JA2_r7609_Korean_Patch_v0.1.3-alpha"
          stage="/tmp/${name}"
          rm -rf "${stage}" "/tmp/${name}.zip" "/tmp/${name}.zip.sha256"
          mkdir -p "${stage}"
          cp -a Patch "${stage}/Patch"
          cp install.ps1 README.md RELEASE_NOTES_v0.1.3-alpha.md "${stage}/"
          cd /tmp
          zip -qr "${name}.zip" "${name}"
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          unzip -tq "${name}.zip"
          cat "${name}.zip.sha256"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          name="JA2_r7609_Korean_Patch_v0.1.3-alpha"
          if gh release view v0.1.3-alpha >/dev/null 2>&1; then
            echo "v0.1.3-alpha already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create v0.1.3-alpha \
            "/tmp/${name}.zip" \
            "/tmp/${name}.zip.sha256" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "JA2 r7609 Korean Patch v0.1.3-alpha" \
            --notes-file RELEASE_NOTES_v0.1.3-alpha.md
