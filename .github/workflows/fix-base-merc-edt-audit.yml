name: Fix BASE MercEdt audit findings

on:
  push:
    branches:
      - fix/restore-base-merc-edt
    paths:
      - .github/workflows/fix-base-merc-edt-audit.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-base-merc-edt
          fetch-depth: 0

      - name: Patch remaining untranslated records
        shell: python
        run: |
          from pathlib import Path
          import struct

          fixes = {
              ('009.EDT', 34): ('Barbaric. As Tolstoy wrote, "War... what is it good for?"', '야만적이군. 톨스토이가 썼듯이, "전쟁... 대체 무슨 소용이지?"'),
              ('024.EDT', 39): ('Hasta la vista, 엄마.', '아스타 라 비스타, 베이비.'),
              ('025.EDT', 109): ('Charlene Higgens.', '샬린 히긴스.'),
          }

          def decode(raw: bytes) -> str:
              vals = struct.unpack('<' + 'H' * (len(raw)//2), raw)
              out = []
              for v in vals:
                  if v == 0:
                      break
                  if v > 33:
                      v -= 1
                  out.append(chr(v))
              return ''.join(out)

          def encode(text: str, size: int = 480) -> bytes:
              vals = []
              for ch in text:
                  v = ord(ch)
                  if v > 33:
                      v += 1
                  vals.append(v)
              vals.append(0)
              raw = struct.pack('<' + 'H' * len(vals), *vals)
              if len(raw) > size:
                  raise ValueError(f'text too long: {text}')
              return raw + b'\0' * (size - len(raw))

          root = Path('Patch/Data/MercEdt')
          for (name, record), (expected, replacement) in fixes.items():
              path = root / name
              data = bytearray(path.read_bytes())
              start = (record - 1) * 480
              end = start + 480
              actual = decode(bytes(data[start:end]))
              assert actual == expected, (name, record, actual)
              data[start:end] = encode(replacement)
              path.write_bytes(data)
              check = decode(path.read_bytes()[start:end])
              assert check == replacement, (name, record, check)
              print(f'{name} record {record}: {replacement}')

      - name: Verify complete runtime dialogue audit
        run: python3 tools/verify_runtime_dialogue_zero.py

      - name: Verify complete BASE MercEdt translated set
        shell: python
        run: |
          from pathlib import Path
          expected = {f'{i:03d}.EDT' for i in range(63)} | {'064.EDT','149.EDT','165.EDT','166.EDT','167.EDT','168.EDT','169.EDT'}
          actual = {p.name for p in Path('Patch/Data/MercEdt').glob('*.EDT')}
          missing = sorted(expected - actual)
          assert not missing, missing
          print(f'BASE_MERCEDT_REQUIRED={len(expected)}')
          print('BASE_MERCEDT_MISSING=0')

      - name: Commit audit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -- .github/workflows/fix-base-merc-edt-audit.yml
          git add -- Patch/Data/MercEdt/009.EDT Patch/Data/MercEdt/024.EDT Patch/Data/MercEdt/025.EDT .github/workflows/fix-base-merc-edt-audit.yml
          git diff --cached --check
          git commit -m "Finish BASE MercEdt dialogue audit"
          git push origin HEAD:fix/restore-base-merc-edt
