name: Apply r7609 Korean runtime hotfix binary

on:
  push:
    branches:
      - fix/runtime-florist-imp-input
    paths:
      - tools/patch_current_korean_exe.py
      - .github/workflows/apply-runtime-hotfix-binary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r7609-korean-runtime-hotfix
  cancel-in-progress: false

jobs:
  patch-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-florist-imp-input
          fetch-depth: 0

      - name: Verify exact input executable
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_current_korean_exe.py Patch/ja2.exe --check
          test "$(stat -c %s Patch/ja2.exe)" -eq 8407552

      - name: Apply reviewed machine-code patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_current_korean_exe.py Patch/ja2.exe --in-place
          python3 tools/patch_current_korean_exe.py Patch/ja2.exe --check
          echo "5087524fa181064a7c4646acee9b96cabb3ded68080a2662a6b242a021eb8ea1  Patch/ja2.exe" | sha256sum --check --strict

      - name: Commit patched executable
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Patch/ja2.exe; then
            echo "Patch/ja2.exe is already the reviewed hotfix build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Patch/ja2.exe
          git commit -m "Apply florist and IMP runtime hotfix to Korean executable"
          git push origin HEAD:fix/runtime-florist-imp-input
