name: Publish v0.1.7-alpha (archived)

# v0.1.7 is frozen. Keep this file only as a historical workflow marker so
# later Patch commits cannot move the v0.1.7 tag or replace its release assets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Frozen release
        run: echo "v0.1.7-alpha is archived; use the current release workflow instead."
