name: Full runtime dialogue audit

on:
  push:
    branches:
      - audit/runtime-dialogue-full
    paths:
      - '.github/workflows/audit-runtime-dialogue-full.yml'
      - 'tools/audit_edt_dialogue.py'
      - 'Patch/Data/MercEdt/**'
      - 'Patch/Data-1.13/MercEdt/**'
      - 'Patch/Data/NPCData/**'
      - 'Patch/Data-1.13/NpcData/**'
      - 'Patch/Data/BinaryData/MERCBIOS.EDT'
      - 'Patch/Data-1.13/BinaryData/MERCBIOS.EDT'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/runtime-dialogue-full
          fetch-depth: 0
      - name: Decode and locate English runtime dialogue
        run: python3 tools/audit_edt_dialogue.py
      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/runtime_dialogue_untranslated.tsv
          if git diff --cached --quiet; then
            echo "Audit report unchanged"
            exit 0
          fi
          git commit -m "Update runtime dialogue untranslated audit"
          git push origin HEAD:audit/runtime-dialogue-full
