name: Restore missing BASE MercEdt files

on:
  push:
    branches:
      - fix/restore-base-merc-edt
    paths:
      - .github/workflows/restore-base-merc-edt.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-base-merc-edt
          fetch-depth: 0

      - name: Download missing translated MercEdt files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Patch/Data/MercEdt
          while read -r name id size; do
            [ -n "$name" ] || continue
            out="Patch/Data/MercEdt/$name"
            curl -L --fail --retry 3 --retry-delay 2 "https://drive.google.com/uc?export=download&id=${id}" -o "$out"
            actual="$(stat -c%s "$out")"
            test "$actual" -eq "$size"
            echo "$name $actual"
          done <<'FILES'
            000.EDT 139bGj3W62wjxuhyh63y0UPO_zOZjp-cA 56160
            001.EDT 1nOS1YoHGI0zaMBNg02XUUFVNTa343voC 56160
            002.EDT 1l-pggVFAgCDT5cT4-cZ95o54fO8MbJuo 56160
