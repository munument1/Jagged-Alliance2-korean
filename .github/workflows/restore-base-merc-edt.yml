            047.EDT 1Pu9rM-73xxBny6ByXvONKifdHRj7hyVd 55200
            048.EDT 1Di9gZFHnLIiZ35PY_uK_CI9MAFRd9Bnx 55200
            049.EDT 1pWgde30e6a6sbtJHicbwwuQGau4u4DN7 55200
            050.EDT 1NkW45Pz3v8tneBkDs5DPQHcsdThjGAYV 55200
            057.EDT 1twQkG8nkyUHFzFTZHyeIrGwjy7WYEocT 57600
            058.EDT 1OQ9eNNVDSClt2axuC-Rty-9BrSScWXO7 57600
            059.EDT 1INYLOvw-bUhYvq8hi-yM4BqtwKfLbgxB 57600
            060.EDT 1OrhXUmOXtQLqKggQIuwypMcgGulDsdyQ 57600
            061.EDT 1-4eCID2pACC5RB2MX87PtwoLKZ0wJmvZ 57600
            062.EDT 1FfCD61qd190eLxEm8VJSUSx1tJiZbq5J 57600
          FILES

      - name: Validate EDT structure and Korean content
        shell: python
        run: |
          from pathlib import Path
          import struct
          names = ['000.EDT','001.EDT','002.EDT','003.EDT','005.EDT','006.EDT','008.EDT','009.EDT','010.EDT','011.EDT','012.EDT','016.EDT','018.EDT','019.EDT','021.EDT','023.EDT','024.EDT','025.EDT','026.EDT','028.EDT','030.EDT','033.EDT','034.EDT','035.EDT','036.EDT','038.EDT','039.EDT','041.EDT','042.EDT','043.EDT','044.EDT','045.EDT','047.EDT','048.EDT','049.EDT','050.EDT','057.EDT','058.EDT','059.EDT','060.EDT','061.EDT','062.EDT']
          for name in names:
              path = Path('Patch/Data/MercEdt') / name
              data = path.read_bytes()
              assert len(data) % 480 == 0, (name, len(data))
              records = len(data) // 480
              hangul = 0
              nonempty = 0
              for i in range(records):
                  chunk = data[i*480:(i+1)*480]
                  values = struct.unpack('<' + 'H' * (len(chunk)//2), chunk)
                  chars = []
                  for value in values:
                      if value == 0:
                          break
                      if value > 33:
                          value -= 1
                      chars.append(chr(value))
                  text = ''.join(chars)
                  if text:
                      nonempty += 1
                  if any('\uac00' <= c <= '\ud7a3' for c in text):
                      hangul += 1
              assert nonempty > 0, name
              assert hangul > 0, (name, nonempty, hangul)
              print(f'{name}: records={records}, nonempty={nonempty}, hangul={hangul}')

      - name: Audit untranslated runtime dialogue
        shell: bash
        run: |
          set +e
          python3 tools/verify_runtime_dialogue_zero.py
          echo "audit_exit=$?"
          exit 0

      - name: Commit restored files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -- .github/workflows/restore-base-merc-edt.yml
