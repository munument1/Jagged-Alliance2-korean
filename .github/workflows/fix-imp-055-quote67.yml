name: Fix IMP 055 quote 67

on:
  push:
    branches:
      - fix/imp-055-quote67
    paths:
      - .github/workflows/fix-imp-055-quote67.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/imp-055-quote67
          fetch-depth: 0

      - name: Patch untranslated IMP dialogue
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import struct

          path = Path("Patch/Data/MercEdt/055.EDT")
          data = bytearray(path.read_bytes())
          assert len(data) == 57600
          assert hashlib.sha256(data).hexdigest() == "7b000cdacf0d903d9076634b4efe3ecbd101fc5c28a8a7e9d669bb46eec4bc37"

          record_index = 66
          offset = record_index * 480

          def decode_record(record: bytes) -> str:
              values = struct.unpack("<" + "H" * (len(record) // 2), record)
              chars = []
              for value in values:
                  if value == 0:
                      break
                  if value > 33:
                      value -= 1
                  chars.append(chr(value))
              return "".join(chars)

          old_text = decode_record(data[offset:offset + 480])
          assert old_text == "It appears there's been a theft here. Stuff's missing.", old_text

          new_text = "여기 도둑이 든 것 같아요. 물건이 없어졌어요."
          encoded = []
          for ch in new_text:
              value = ord(ch)
              encoded.append(value + 1 if value > 32 else value)
          encoded.append(0)

          record = bytearray(480)
          packed = struct.pack("<" + "H" * len(encoded), *encoded)
          record[:len(packed)] = packed
          data[offset:offset + 480] = record
          path.write_bytes(data)

          assert decode_record(data[offset:offset + 480]) == new_text
          assert hashlib.sha256(data).hexdigest() == "d93a50953a81df491c4c3f07e38d7363cba8ef42cb75bc4138c1a215a3c922ce"
          print(f"Patched quote 67: {new_text}")

      - name: Run runtime dialogue QA
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_runtime_dialogue.py
          python3 tools/verify_runtime_dialogue_zero.py

      - name: Commit patched EDT
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -- .github/workflows/fix-imp-055-quote67.yml
          git add -- Patch/Data/MercEdt/055.EDT .github/workflows/fix-imp-055-quote67.yml
          git diff --cached --check
          git commit -m "Translate remaining IMP 055 dialogue"
          git push origin HEAD:fix/imp-055-quote67
